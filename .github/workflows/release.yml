# Publishes both images to Docker Hub when a version tag is pushed.
#
#   git tag v1.3.0
#   git push origin v1.3.0
#
# The tag is the version: v1.3.0 publishes 1.3.0 and moves latest. Nothing is
# published from a normal push to main - only from a deliberate tag.

name: Release

on:
  push:
    tags: ["v*"]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -v

  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    # A failing test must not reach Docker Hub.
    needs: test

    steps:
      - uses: actions/checkout@v4

      # v1.3.0 -> 1.3.0. Image tags conventionally omit the leading v.
      - name: Read the version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # The model is in DVC storage, not in git.
      - name: Fetch the model from DVC storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DAGSHUB_TOKEN }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          uv run dvc pull models/model.joblib models/scaler.joblib reports/cluster_profile.csv

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Two tags at once: the exact version, and latest. Deployments should
      # name the version; latest is a convenience for humans.
      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rfm-api:${{ steps.version.outputs.value }}
            ${{ secrets.DOCKERHUB_USERNAME }}/rfm-api:latest
          build-args: APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dashboard
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rfm-dashboard:${{ steps.version.outputs.value }}
            ${{ secrets.DOCKERHUB_USERNAME }}/rfm-dashboard:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Published \`${{ steps.version.outputs.value }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ secrets.DOCKERHUB_USERNAME }}/rfm-api:${{ steps.version.outputs.value }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ secrets.DOCKERHUB_USERNAME }}/rfm-dashboard:${{ steps.version.outputs.value }}\`" >> "$GITHUB_STEP_SUMMARY"
