[project]
name = "dvc-experiment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dvc[s3]",
    "fastapi>=0.141.1",
    "hydra-core",
    "joblib",
    "matplotlib>=3.11.1",
    "mlflow",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "python-dotenv",
    "scikit-learn>=1.9.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
# Only what the API imports. The Docker image installs this group alone, so it
# carries none of the training tooling (DVC, MLflow, Hydra). `uv sync` locally
# still installs everything above. Both resolve through the same uv.lock, so
# scikit-learn here is the exact version the model was trained with.
serve = [
    "fastapi>=0.141.1",
    "joblib",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "uvicorn[standard]>=0.52.4",
]
# What the dashboard container needs. It never loads the model, so no
# scikit-learn: predictions come from the API over the network.
dashboard = [
    "pandas>=3.0.5",
    "requests",
    "streamlit",
]
# Installed by `uv sync` locally and in CI, but in none of the images.
dev = [
    "httpx2>=2.13.1",
    "pytest",
]

[tool.pytest.ini_options]
# The code lives in src/ without being an installed package, so pytest is told
# where to find it rather than every test file adjusting sys.path.
pythonpath = ["src"]
testpaths = ["tests"]

# Tests that load models/model.joblib. The model is tracked by DVC, not git, so
# a fresh checkout does not have it:
#
#   uv run pytest -m "not needs_model"   # no credentials required
#   uv run pytest -m "needs_model"       # after `dvc pull`
#
# CI runs the first form in its fast job and the second only after fetching the
# model, which keeps `uv run pytest` working for anyone who clones the repo.
markers = [
    "needs_model: requires the trained model and scaler on disk",
]
