stages:
  featurize:
    cmd: python src/featurize.py hydra.run.dir=outputs/dvc/featurize
    deps:
      - Online Retail.xlsx
      - src/featurize.py
    params:
      - conf/config.yaml:
          - data
          - features
          - paths
    outs:
      - data/target_dataset.csv
      - data/features.csv
      - models/scaler.joblib

  train:
    cmd: python src/train.py hydra.run.dir=outputs/dvc/train
    deps:
      - data/features.csv
      - src/train.py
      # Model settings live in the Hydra config group, not conf/config.yaml,
      # so DVC watches those files directly.
      - conf/model
    outs:
      - models/model.joblib
      - data/labels.csv

  evaluate:
    cmd: python src/evaluate.py hydra.run.dir=outputs/dvc/evaluate
    deps:
      - data/features.csv
      - data/target_dataset.csv
      - data/labels.csv
      - models/model.joblib
      - src/evaluate.py
      - conf/model
    params:
      - conf/config.yaml:
          - evaluate
          - mlflow
    outs:
      - data/segmented_customers.csv
      - reports/cluster_profile.csv
    metrics:
      - metrics.json:
          cache: false
